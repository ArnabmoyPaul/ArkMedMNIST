  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11.15
  - numpy=2.4.6
  - pillow=12.3.0
  - scikit-learn=1.9.0
  - scikit-image=0.26.0
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
