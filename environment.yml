      - timm==1.0.28
      - medmnist==3.0.2
      - tqdm==4.68.4
      - PyYAML==6.0.2
      - opencv-python==4.11.0.86
      - albumentations==1.4.24
      - pydicom==2.4.4
      - wandb==0.19.1
